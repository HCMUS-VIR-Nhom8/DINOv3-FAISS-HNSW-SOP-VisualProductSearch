model:
  backend: hf                  # PHAI khop offline.yaml
  name_or_path: facebook/dinov3-vitb16-pretrain-lvd1689m   # PHAI khop offline.yaml
  torchhub_repo_dir: external/dinov3
  torchhub_arch: dinov3_vitb16
  torchhub_weights: null
  device: cuda
  image_size: 224               # PHAI khop offline.yaml
  embedding_dim: 768            # PHAI khop offline.yaml

retrieval:
  top_n_candidates: 200         # so ung vien lay tu MOI index truoc rerank
  ef_search: 128                # tham so truy van cho HNSW (static index)

# --- Phan CAI TIEN (Hinh 2.9) - dynamic catalog, khong co o pipeline baseline ---
dynamic:
  buffer_path: data/index/dynamic_buffer.index
  buffer_id_map_path: data/index/dynamic_id_map.npy
  rebuild_threshold: 5000       # so item buffer truoc khi nen gop lai vao static index

blacklist:
  path: data/index/blacklist.bin

rerank:
  alpha_visual: 0.85            # trong so diem hinh anh trong Text Re-ranking
  top_k: 20                     # so ket qua cuoi cung tra ve

paths:
  static_index_path: data/index/static_hnsw.index   # PHAI trung voi offline.yaml
  static_id_map_path: data/index/static_id_map.npy
